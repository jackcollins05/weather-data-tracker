name: Daily weather data

on:
  schedule:
    # Primary: 09:17 UTC = 03:17 CST / 04:17 CDT.
    - cron: '17 9 * * *'
    # Retry 1: 12:17 UTC = 06:17 CST / 07:17 CDT.
    - cron: '17 12 * * *'
    # Retry 2: 15:47 UTC = 09:47 CST / 10:47 CDT.
    - cron: '47 15 * * *'
    # Final retry: 19:47 UTC = 13:47 CST / 14:47 CDT.
    - cron: '47 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-weather-data-${{ github.repository }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check whether today's production data already exists
        id: daily_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LAST_DATE="$(python3 - <<'PY2'
          import json
          from pathlib import Path
          status = json.loads(Path("data/status.json").read_text())
          print(str(status.get("run_time", ""))[:10])
          PY2
          )"
          TODAY="$(date -u +%F)"

          echo "Event: $EVENT_NAME"
          echo "Last production date: $LAST_DATE"
          echo "Today's UTC date: $TODAY"

          if [ "$EVENT_NAME" = "schedule" ] && [ "$LAST_DATE" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's production data already exists. Skipping duplicate scheduled run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Production run should proceed."
          fi
      - uses: actions/setup-python@v5
        if: steps.daily_guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.daily_guard.outputs.skip != 'true'
      - name: Test before fetching
        if: steps.daily_guard.outputs.skip != 'true'
        run: uv run pytest -q
      - name: Fetch and rebuild data
        if: steps.daily_guard.outputs.skip != 'true'
        run: uv run python -m weather_tracker.daily
      - name: Publish dated issue
        if: steps.daily_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m weather_tracker.publish_issue
      - name: Commit generated data only
        if: steps.daily_guard.outputs.skip != 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          GENERATED_PATHS=(data/history.csv data/status.json)
          git add -A -- data/history.csv data/status.json
          if [ -n "$(git ls-files --cached --others --exclude-standard -- data/raw)" ]; then
            git add -A -- data/raw
            GENERATED_PATHS+=(data/raw)
          fi
          if git diff --cached --quiet; then
            echo "No generated-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RUN_DATE="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("data/status.json").read_text())["run_time"][:10])')"
          git commit --only -m "Update weather data ${RUN_DATE}" -- "${GENERATED_PATHS[@]}"
          git push origin "HEAD:${TARGET_BRANCH}"
